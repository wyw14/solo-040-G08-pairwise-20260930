<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Interlocks</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a aria-current="page" href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Interlock control</h1><div class="muted">Mutual exclusion, emergency equipment and device telemetry</div></div></div><div class="grid" id="interlock-grid"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,setMessage,withBusy}=window.LockFlow; const host=document.querySelector('#interlock-grid'); const message=document.querySelector('#message');
async function stop(chamber,button){await withBusy(button,async()=>{try{await api(`/api/chambers/${chamber}/emergency`,{method:'POST',body:'{}'});await load();}catch(e){setMessage(message,e.message);}});}
const STATUS_CLASS={online:'',offline:'critical',unknown:'warning'};
function deviceRow(entry){
  const h=entry.health||{}; const o=entry.observation||null;
  let reading='-';
  if(o){
    if(o.position) reading=o.position;
    else if(o.opening_pct!==null&&o.opening_pct!==undefined) reading=o.opening_pct+'%';
    else reading=o.status;
  }
  const stamp=o?new Date(o.observed_at).toLocaleTimeString():'never';
  return `<tr><td>${h.device}</td><td><span class="status ${STATUS_CLASS[h.status]||'warning'}">${h.status}</span></td><td>${reading}</td><td>${stamp}</td></tr>`;
}
async function load(){
  const data=await api('/api/interlocks');
  host.innerHTML=Object.entries(data).filter(([id])=>id!=='signal_handoffs').map(([id,item])=>{
    const devices=(item.devices||[]).map(deviceRow).join('')||'<tr><td colspan="4" class="muted">No devices registered</td></tr>';
    return `<section class="panel"><h2>${id} <span class="status ${STATUS_CLASS[item.health]||'warning'}" style="float:right">${item.health}</span></h2>
      <table><tr><th>Emergency</th><td>${item.emergency.status}</td></tr><tr><th>Level</th><td>${item.equipment.LevelM??item.equipment.level_m??0} m</td></tr><tr><th>Pending commands</th><td>${item.pending_commands.length}</td></tr></table>
      <table><thead><tr><th>Device</th><th>Health</th><th>Last reading</th><th>Observed</th></tr></thead><tbody>${devices}</tbody></table>
      <button class="danger" data-stop="${id}">Emergency stop</button></section>`;
  }).join('');
  host.querySelectorAll('[data-stop]').forEach((button)=>button.addEventListener('click',()=>stop(button.dataset.stop,button)));
  setMessage(message,'');
}
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
