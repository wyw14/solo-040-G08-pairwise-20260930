<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Interlocks</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a aria-current="page" href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Interlock control</h1><div class="muted">Mutual exclusion and emergency equipment state</div></div></div><div class="grid" id="interlock-grid"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,setMessage,withBusy}=window.LockFlow; const host=document.querySelector('#interlock-grid'); const message=document.querySelector('#message');
const stateClass=(state)=>state==='offline'?'critical':state==='unknown'?'warning':'';
async function stop(chamber,button){await withBusy(button,async()=>{try{await api(`/api/chambers/${chamber}/emergency`,{method:'POST',body:'{}'});await load();}catch(e){setMessage(message,e.message);}});}
function deviceTable(devices){const rows=devices.map((d)=>`<tr><td>${d.device}</td><td><span class="status ${stateClass(d.state)}">${d.state}</span></td><td>${d.status||'-'}</td><td>${d.observed_at?new Date(d.observed_at).toLocaleTimeString():'-'}</td><td>${d.late_count} / ${d.out_of_order_count}</td><td>${d.message}</td></tr>`).join('');return `<h3>Device telemetry</h3><table><thead><tr><th>Device</th><th>State</th><th>Status</th><th>Observed</th><th>Late / Out-of-order</th><th>Message</th></tr></thead><tbody>${rows}</tbody></table>`;}
async function load(){const [data,devices]=await Promise.all([api('/api/interlocks'),api('/api/telemetry/devices')]);const byChamber={};devices.forEach((d)=>{(byChamber[d.chamber_id]=byChamber[d.chamber_id]||[]).push(d);});host.innerHTML=Object.entries(data).filter(([,item])=>item&&item.equipment).map(([id,item])=>`<section class="panel"><h2>${id}</h2><table><tr><th>Emergency</th><td>${item.emergency.status}</td></tr><tr><th>Level</th><td>${item.equipment.LevelM??item.equipment.level_m??0} m</td></tr><tr><th>Pending commands</th><td>${item.pending_commands.length}</td></tr></table>${deviceTable(byChamber[id]||[])}<button class="danger" data-stop="${id}">Emergency stop</button></section>`).join('');host.querySelectorAll('[data-stop]').forEach((button)=>button.addEventListener('click',()=>stop(button.dataset.stop,button)));}
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
